[package]
name = "vmp-soruntime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `libqvmp_runtime.so`. Loaded into a hardened ELF either via DT_NEEDED
# (rewriter add-needed pass) or via LD_PRELOAD on the device.
name = "qvmp_runtime"
crate-type = ["cdylib"]

[dependencies]
vmp-stub.workspace = true
vmp-core.workspace = true
vmp-interpreter.workspace = true
libc = "0.2"
log = "0.4"
