# NDK toolchain for cross compile.
# Default points at Linux NDK install at /opt/android-ndk-r26d (CI / Linux dev).
# On Windows / different layout, override with .cargo/config.local.toml or env.
[target.aarch64-linux-android]
linker = "/opt/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
ar = "/opt/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[env]
CC_aarch64_linux_android = "/opt/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
AR_aarch64_linux_android = "/opt/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
